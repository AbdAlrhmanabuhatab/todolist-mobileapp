name: todolist
description: >-
  A professional To-Do List application built with Flutter.
  Features clean architecture, state management with Provider,
  and a responsive UI design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/shape.png
    - images/image1.png
    - images/image2.png
    - images/abed.jpg
    - images/clock.png
